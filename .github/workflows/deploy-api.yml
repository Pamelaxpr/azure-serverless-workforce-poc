name: Build and Deploy FastAPI to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

# PERMISOS CRÍTICOS PARA OIDC: Necesitamos permisos de escritura en 'id-token'
permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: API DE INGESTIÓN (FastAPI)
  # =========================================================================
  deploy-api:
    name: Deploy API Ingestion
    runs-on: ubuntu-latest

    steps:
      # 1. Obtenemos el código fuente
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Login en el Azure Container Registry usando la contraseña de Admin que configuraste antes
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Compilamos el Dockerfile y subimos la imagen al ACR
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/workforce-api:${{ github.sha }}
          # Ajusta la ruta si tu Dockerfile está en otra carpeta. Aquí asumimos que está en la raíz o en src/api_ingestion
          docker build -t $IMAGE_TAG ./src/api_ingestion
          docker push $IMAGE_TAG

      # 4. Magia OIDC: Login en Azure SIN CONTRASEÑAS (usando la Identidad Federada)
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Despliegue Real en Azure Container Apps (Zero Trust)
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: rg-workforce-app
          containerAppName: ca-workforce-api
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/workforce-api:${{ github.sha }}
          managedIdentityClientId: ${{ secrets.AZURE_CA_IDENTITY_CLIENT_ID }}

  # =========================================================================
  # JOB 2: CONSUMIDOR ASÍNCRONO (Async Worker + KEDA)
  # =========================================================================
  deploy-worker:
    name: Deploy Async Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Worker Image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/workforce-worker:${{ github.sha }}
          docker build -t $IMAGE_TAG ./src/async_worker
          docker push $IMAGE_TAG

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Worker Identity Client ID
        id: worker-id
        run: |
          CLIENT_ID=$(az identity show \
            --name id-workforce-worker \
            --resource-group rg-workforce-app \
            --query clientId -o tsv)
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Deploy Worker to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: rg-workforce-app
          containerAppName: ca-workforce-worker
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/workforce-worker:${{ github.sha }}
          managedIdentityClientId: ${{ steps.worker-id.outputs.client_id }}
  
  # =========================================================================
  # JOB 3: PANEL WEB INTERACTIVO (Streamlit)
  # =========================================================================
  deploy-panel:
    name: Deploy Web Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Panel Image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/workforce-panel:${{ github.sha }}
          docker build -t $IMAGE_TAG ./src/web_panel
          docker push $IMAGE_TAG

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Panel Identity Client ID
        id: panel-id
        run: |
          CLIENT_ID=$(az identity show \
            --name id-workforce-panel \
            --resource-group rg-workforce-app \
            --query clientId -o tsv)
          echo "CLIENT_ID obtenido: $CLIENT_ID"
          test -n "$CLIENT_ID"
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Deploy Panel to Azure Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt

          # Obtiene el ID exacto (respetando mayúsculas/minúsculas) ya asignado a la app
          IDENTITY_ID=$(az containerapp show \
            --name ca-workforce-panel \
            --resource-group rg-workforce-app \
            --query "keys(identity.userAssignedIdentities)[0]" -o tsv)

          echo "Identidad detectada: $IDENTITY_ID"
          test -n "$IDENTITY_ID"

          az containerapp registry set \
            --name ca-workforce-panel \
            --resource-group rg-workforce-app \
            --server ${{ secrets.ACR_LOGIN_SERVER }} \
            --identity "$IDENTITY_ID"

          az containerapp update \
            --name ca-workforce-panel \
            --resource-group rg-workforce-app \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/workforce-panel:${{ github.sha }}
