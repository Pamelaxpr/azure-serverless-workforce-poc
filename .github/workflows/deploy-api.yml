name: Build and Deploy FastAPI to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

# PERMISOS CRÍTICOS PARA OIDC: Necesitamos permisos de escritura en 'id-token'
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Obtenemos el código fuente
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Login en el Azure Container Registry usando la contraseña de Admin que configuraste antes
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Compilamos el Dockerfile y subimos la imagen al ACR
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/workforce-api:${{ github.sha }}
          # Ajusta la ruta si tu Dockerfile está en otra carpeta. Aquí asumimos que está en la raíz o en src/api_ingestion
          docker build -t $IMAGE_TAG ./src/api_ingestion
          docker push $IMAGE_TAG

      # 4. Magia OIDC: Login en Azure SIN CONTRASEÑAS (usando la Identidad Federada)
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Despliegue Real: Reemplazamos la Imagen Fantasma en Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: rg-workforce-app
          containerAppName: ca-workforce-api
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/workforce-api:${{ github.sha }}
          managedIdentityClientId: ${{ secrets.AZURE_CA_IDENTITY_CLIENT_ID }}
          # AÑADIMOS LAS LLAVES PARA QUE LA CONTAINER APP PUEDA ENTRAR AL ALMACÉN:
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}